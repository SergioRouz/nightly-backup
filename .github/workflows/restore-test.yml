# Репетиция восстановления (RTO <= 4 ч): скачивает свежайший бэкап из R2,
# расшифровывает, восстанавливает в чистый Postgres 17 и проверяет, что
# ключевые таблицы И АККАУНТЫ ПОЛЬЗОВАТЕЛЕЙ (auth.users) на месте.
# Запуск: вручную (workflow_dispatch) + раз в месяц по расписанию.
name: Backup restore rehearsal

on:
  schedule:
    - cron: '41 3 1 * *' # 1-го числа каждого месяца
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restoretest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Download latest daily backup from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          LATEST=$(aws s3 ls "s3://$BUCKET/daily/" --endpoint-url "$ENDPOINT" | awk '{print $4}' | sort | tail -n 1)
          echo "Latest backup: $LATEST"
          test -n "$LATEST"
          aws s3 cp "s3://$BUCKET/daily/$LATEST" db.dump.enc --endpoint-url "$ENDPOINT"

      - name: Decrypt
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:BACKUP_PASSPHRASE \
            -in db.dump.enc -out db.dump
          test -s db.dump && echo "decrypt: OK"
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - name: Restore into clean Postgres 17
        run: |
          docker run --rm --network host -v "$PWD:/backup" postgres:17 \
            pg_restore --no-owner --no-privileges \
            --dbname "postgresql://postgres:restoretest@localhost:5432/postgres" \
            /backup/db.dump || true
          # pg_restore может ругаться на отсутствующие роли Supabase — это ок;
          # критерий ниже: таблицы, данные И аккаунты восстановлены.

      - name: Sanity check
        # Репо публичный — счётчики в лог не печатаем, только OK/провал.
        run: |
          q() { docker run --rm --network host postgres:17 \
            psql "postgresql://postgres:restoretest@localhost:5432/postgres" -tAc "$1"; }
          TABLES=$(q "select count(*) from information_schema.tables where table_schema = 'public';" | tr -d '[:space:]')
          test "$TABLES" -ge 20 && echo "public tables: OK"
          USERS=$(q "select count(*) from auth.users;" | tr -d '[:space:]')
          test "$USERS" -ge 2 && echo "auth.users: OK (аккаунты восстановимы)"
          q "select id from public.keepalive limit 1;" >/dev/null && echo "data readable: OK"
          echo "RESTORE REHEARSAL: OK"
