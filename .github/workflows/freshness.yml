# Сторож свежести бэкапа (аудит ops-2026-10 В4): раз в сутки проверяет, что в R2 есть файл не старше 2 суток.
# Ловит случай, когда ночной бэкап молча встал (отключённое расписание, протухший ключ, упавший pg_dump) —
# иначе об этом узнали бы только при первой репетиции. Падение workflow = письмо GitHub.
name: Backup freshness

on:
  schedule:
    - cron: '17 12 * * *' # 12:17 UTC — после любых задержек ночного бэкапа
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Newest daily backup is at most 2 days old
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          LATEST=$(aws s3 ls "s3://$BUCKET/daily/" --endpoint-url "$ENDPOINT" | awk '{print $4}' | sort | tail -n 1)
          test -n "$LATEST" || { echo "::error::В daily/ нет ни одного бэкапа"; exit 1; }
          FDATE=$(echo "$LATEST" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$FDATE" +%s) ) / 86400 ))
          echo "Последний бэкап: $FDATE, возраст $AGE d"
          if [ "$AGE" -gt 2 ]; then echo "::error::Последний бэкап $FDATE старше 2 суток — ночной бэкап не работает"; exit 1; fi
